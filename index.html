<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Predaj Čaj o 41vej</title>
  <meta name="theme-color" content="#284d36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Modak&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf3e3;
  --mustard:#eaa83b;
  --terracotta:#9b553a;
  --green:#807950;
  --darkgreen:#284d36;
  --pink:#d98e84;
}

* {
  box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: var(--cream);
    color: var(--green);

    display: flex;
    justify-content: center;
    align-items: center;
  }

header {
  text-align: center;
  font-family: 'Modak', 'Trebuchet MS', sans-serif;
  font-weight: normal;
  font-size: 40px;
  color: var(--darkgreen);
  padding: 10px;
  border-bottom: 2px solid var(--pink);
  cursor: pointer;
}

.container {
  display: flex;
  flex: 1;
  min-height: 0;
}

.list {
  flex: 2;
  padding: 15px;
  overflow-y: auto;
}

.cart {
  flex: 1;
  padding: 15px;
  border-left: 2px solid var(--pink);
  overflow-y: auto;
}

h2 {
  margin-top: 10px;
  font-size: 1.3rem;
  color: var(--terracotta);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* GRID ITEMS */
.items {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* ITEM STYLE */
.item {
  background: #fff;
  padding: 12px;
  border-radius: 14px;
  box-shadow: 0 6px 20px rgba(44,74,54,0.08);
  text-align: center;
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--darkgreen);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.item:hover {
  box-shadow: 0 8px 22px rgba(44,74,54,0.14);
}

.item-price {
  font-size: 0.7rem;
  font-weight: normal;
  color: var(--terracotta);
  margin-top: 4px;
}

/* CART ITEMS */
.cart-item {
  background: #fff;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 4px 14px rgba(44,74,54,0.08);
  margin-bottom: 10px;
  cursor: pointer;
}

/* BOTTOM BAR */
.bottom {
  display: flex;
  gap: 10px;
  padding: 10px;
  border-top: 2px solid var(--pink);
  position: sticky;
  bottom: 0;
  background: var(--cream);
}

.done-btn {
  flex: 3;
  background: var(--terracotta);
  color: #fff;
  padding: 20px;
  text-align: center;
  font-weight: bold;
  border-radius: 999px;
  box-shadow: 0 6px 16px rgba(155,85,58,0.35);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.done-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(155,85,58,0.45);
}

.clear-btn {
  flex: 1;
  background: #fff;
  color: var(--terracotta);
  border: 1px solid var(--terracotta);
  padding: 20px;
  text-align: center;
  font-weight: bold;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.clear-btn:hover {
  background: var(--terracotta);
  color: #fff;
}

.app {
  width: 100%;
  max-width: 480px;
  height: 100vh; /* 👈 important */
  background: var(--cream);
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  font-size: 32px;
  padding: 15px;
  border-bottom: 2px solid var(--pink);
  flex-shrink: 0;
}

.item:active {
  transform: scale(0.95);
}

.cart-item:active {
  transform: scale(0.95);
}

button {
  width: auto;
  display: inline-block;
  padding: 10px 15px;
}

/* CART ITEM BTN (JUST SO I KNOW) */
.cart-item-btn {
  display: block;
  width: 100%;
  margin: 8px 0;
  padding: 12px;

  background: #fff;
  box-shadow: 0 4px 14px rgba(44,74,54,0.08);
  border: none;
  border-radius: 10px;
  color: var(--darkgreen);

  font-size: 16px;
  text-align: left;

  cursor: pointer;
  transition: 0.2s;
}

.cart-item-btn:hover {
  background: var(--mustard);
  color: #fff;
  transform: scale(1.02);
}

/* SPOT PICKER MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(40,77,54,0.45);
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.modal-card {
  background: var(--cream);
  border-radius: 18px;
  padding: 24px;
  width: 100%;
  max-width: 320px;
  box-shadow: 0 10px 30px rgba(44,74,54,0.25);
}

.modal-card h2 {
  text-align: center;
  margin-top: 0;
}

.spot-option {
  background: #fff;
  border: 1px solid var(--terracotta);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 10px;
  text-align: center;
  font-weight: bold;
  color: var(--darkgreen);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.spot-option:last-child {
  margin-bottom: 0;
}

.spot-option:hover {
  background: var(--terracotta);
  color: #fff;
}

/* PAYMENT MODAL */
.payment-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 20px 0;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(155,85,58,0.2);
  border-top-color: var(--terracotta);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.payment-result {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.payment-amount {
  font-family: 'Modak', 'Trebuchet MS', sans-serif;
  font-size: 2rem;
  color: var(--darkgreen);
}

.payment-qr {
  border-radius: 12px;
  background: #fff;
  padding: 8px;
  box-shadow: 0 6px 20px rgba(44,74,54,0.12);
  line-height: 0;
}

.payment-qr img {
  display: block;
  width: 100%;
  max-width: 240px;
  height: auto;
}

.payment-checking {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  color: var(--terracotta);
  font-size: 0.95rem;
}

.payment-checking-status {
  display: flex;
  align-items: center;
  gap: 10px;
}

.payment-actions {
  display: flex;
  gap: 20px;
}

.icon-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
}

.icon-btn-cancel {
  background: #fff;
  color: var(--terracotta);
  border: 1px solid var(--terracotta);
}

.icon-btn-cancel:hover {
  background: var(--terracotta);
  color: #fff;
}

.icon-btn-check {
  width: auto;
  height: auto;
  padding: 12px 24px;
  border-radius: 999px;
  font-size: 0.95rem;
  font-weight: bold;
  background: var(--terracotta);
  color: #fff;
  box-shadow: 0 6px 16px rgba(155,85,58,0.35);
}

.icon-btn-check:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(155,85,58,0.45);
}

.spinner-small {
  width: 20px;
  height: 20px;
  border-width: 3px;
}

.payment-success {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: #2e7d32;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  line-height: 1;
}

.payment-failed {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  color: var(--terracotta);
}

.payment-email {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 16px;
}

.payment-email-input {
  padding: 14px 16px;
  border-radius: 999px;
  border: 1px solid var(--terracotta);
  font-size: 1rem;
  font-family: inherit;
}
</style>
</head>

<body>
  <div id="main-page" class="app">
    <header id="app-header" onclick="openSpotPicker()">Bufet - Čaj o 41vej</header>

    <div class="container">
      <div class="list" id="categories-container"></div>
      <div class="cart">
        <h2>CART</h2>
        <div id="cart-items"></div>
      </div>
    </div>

    <div class="bottom">
      <div class="clear-btn" onclick="clearCart()">CLEAR</div>
      <div id="doneBtn" class="done-btn" onclick="handleDoneClick()">PAY 0.00 EUR</div>
    </div>

  </div> <!-- ✅ MAIN PAGE ENDS HERE -->

  <!-- SPOT PICKER MODAL -->
  <div id="spot-modal" class="modal-overlay" onclick="closeSpotPicker()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2>Vyber miesto</h2>
      <div id="spot-options"></div>
    </div>
  </div>

  <!-- PAYMENT MODAL -->
  <div id="payment-modal" class="modal-overlay">
    <div class="modal-card">
      <div id="payment-email" class="payment-email" style="display: none;">
        <h2>Email (nepovinné)</h2>
        <input type="email" id="payment-email-input" class="payment-email-input" placeholder="tvoj@email.sk" />
        <div class="done-btn" onclick="submitPaymentEmail()">Pokračovať</div>
      </div>
      <div id="payment-loading" class="payment-loading" style="display: none;">
        <div class="spinner"></div>
        <p>Vytváram platbu…</p>
      </div>
      <div id="payment-result" class="payment-result" style="display: none;">
        <div class="payment-amount">
          <span id="payment-amount"></span>&nbsp;<span id="payment-currency"></span>
        </div>
        <div id="payment-qr" class="payment-qr"></div>
        <div id="payment-success" class="payment-success" style="display: none;">✓</div>

        <div id="payment-checking" class="payment-checking">
          <div class="payment-checking-status">
            <div class="spinner spinner-small"></div>
            <p>Čakám na potvrdenie platby…</p>
          </div>
        </div>

        <div id="payment-failed" class="payment-failed" style="display: none;">
          <p>Platbu sa nepodarilo potvrdiť. Ak si už zaplatil, môže to chvíľu trvať.</p>
          <div class="clear-btn" onclick="checkPaymentNow()">Skontrolovať znova</div>
        </div>

        <div class="payment-actions">
          <div id="payment-cancel-btn" class="icon-btn icon-btn-cancel" onclick="cancelPayment()" title="Zrušiť platbu">🗑</div>
          <div class="icon-btn icon-btn-check" onclick="finishPaymentModal()" title="Zavrieť">Zavrieť</div>
        </div>
      </div>
    </div>
  </div>

  <script src="qrcode.js"></script>
  <script src="script.js"></script>

</body>
</html>
